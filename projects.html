  <section class="page-section">
    <div class="container">
      <h2 class="section-title">项目作品</h2>
      <div class="section-line"></div>

      <div class="projects-grid">
        <!-- 项目：Weather Dashboard -->
        <article class="project-card">
          <div class="project-image" id="hangzhou-weather">
            <div class="live-weather">
              <div class="live-weather-city">Hangzhou</div>
              <img class="live-weather-icon" src="" alt="">
              <div class="live-weather-temp">--°</div>
              <div class="live-weather-desc">Loading...</div>
              <div class="live-weather-detail">Humidity: --%</div>
            </div>
          </div>
          <div class="project-info">
            <span class="project-category">Web 应用</span>
            <h3 class="project-title">Weather Dashboard</h3>
            <p class="project-desc">
              基于 OpenWeatherMap API 的天气查询面板，支持城市搜索、实时天气和 5 天预报。
            </p>
            <div class="project-links">
              <a href="https://weather-dashboard-3xa.pages.dev/" target="_blank" rel="noopener" class="btn btn-outline">在线体验</a>
              <a href="https://github.com/wyh3250103884-star/weather-dashboard" target="_blank" rel="noopener">详情 &rarr;</a>
            </div>
          </div>
        </article>

        <!-- 项目一：工图知识抽查器 -->
        <article class="project-card">
          <div class="project-image">
            <video controls loop muted playsinline preload="metadata" class="project-img">
              <source src="img/gtzsccq.mp4" type="video/mp4">
            </video>
          </div>
          <div class="project-info">
            <span class="project-category">硬件作品</span>
            <h3 class="project-title">工图知识抽查器</h3>
            <p class="project-desc">
              基于步进电机的两个转盘装置，在原理上可以达到抽查工图知识的效果。
            </p>
            <div class="project-links">
              <a href="https://github.com/wyh3250103884-star/wuyan-s-first-home/tree/main/wyh_cxxm_gtzsccq" target="_blank" rel="noopener" class="btn btn-outline">查看案例</a>
              <a href="https://github.com/wyh3250103884-star/wuyan-s-first-home/tree/main/wyh_cxxm_gtzsccq" target="_blank" rel="noopener">详情 &rarr;</a>
            </div>
          </div>
        </article>

      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 无烟. 保留所有权利。</p>
  </footer>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var container = document.getElementById('hangzhou-weather');
      if (!container) return;

      var icon = container.querySelector('.live-weather-icon');
      var temp = container.querySelector('.live-weather-temp');
      var desc = container.querySelector('.live-weather-desc');
      var detail = container.querySelector('.live-weather-detail');

      fetch('https://api.openweathermap.org/data/2.5/weather?q=Hangzhou&appid=' + PORTFOLIO_API_KEY + '&units=metric')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          icon.src = 'https://openweathermap.org/img/wn/' + data.weather[0].icon + '@2x.png';
          icon.alt = data.weather[0].description;
          temp.textContent = Math.round(data.main.temp) + '°C';
          desc.textContent = data.weather[0].description;
          detail.textContent = 'Humidity: ' + data.main.humidity + '%';
        })
        .catch(function () {
          temp.textContent = 'Hangzhou';
          desc.textContent = '';
          detail.textContent = '';
        });
    })();
  </script>
</body>
