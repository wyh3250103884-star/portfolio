  <section class="page-section">
    <div class="container">
      <h2 class="section-title">与我联系</h2>
      <div class="section-line"></div>

      <p class="contact-intro">
        有项目想法或只是想打个招呼？填写下方表单，我会尽快回复你。
      </p>

      <form class="contact-form" id="contact-form" action="https://formspree.io/f/mojgkznl" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" placeholder="请输入你的姓名" required>
          </div>
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="subject">主题</label>
          <input type="text" id="subject" name="subject" placeholder="你想聊些什么？">
        </div>

        <div class="form-group">
          <label for="message">留言</label>
          <textarea id="message" name="message" rows="6" placeholder="请输入你的留言..." required></textarea>
        </div>

        <p class="form-status" id="form-status"></p>
        <button type="submit" class="btn btn-primary" id="submit-btn">发送消息</button>
      </form>

      <div class="contact-links">
        <a href="mailto:18858826287@163.com" class="contact-link">
          <span class="contact-icon">✉</span> 18858826287@163.com
        </a>      </div>
    </div>
  </section>
